<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Game Day Soundboard</title>
<meta name="theme-color" content="#07173A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Soundboard">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600&display=swap">
<style>
/* Layout: one full-screen board. Header, tag tabs, a button grid that fills the rest, and an edit drawer.
   One committed look: dark navy ground, Bills red and royal blue, white type. */
:root {
  --navy-900: #07173A;
  --navy-800: #0D2250;
  --navy-700: #16306B;
  --red: #C60C30;
  --accent: #C60C30;
  --accent-ink: #FFFFFF;
  --accent-deep: #4A1226;
  --accent-soft: #F4B6C0;
  --stripe1: #C60C30;
  --stripe2: #FFFFFF;
  --stripe3: #2A5FC7;
  --red-deep: #4A1226;
  --royal: #00338D;
  --blue: #2A5FC7;
  --ice: #E6ECF8;
  --ink: #FFFFFF;
  --muted: rgba(255, 255, 255, 0.62);
  --line: rgba(255, 255, 255, 0.16);
  --display: 'Barlow Condensed', 'Avenir Next Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; background: var(--navy-900); color: var(--ink);
  font-family: var(--body); -webkit-text-size-adjust: 100%; overscroll-behavior: none;
}
body {
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
input, canvas { touch-action: none; }
input[type=text] { touch-action: manipulation; -webkit-user-select: text; user-select: text; }
:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
[hidden] { display: none !important; }

/* Sabres: navy and gold. Only the tokens change. */
:root[data-team=sabres] {
  --navy-900: #031B3F; --navy-800: #0B2C63; --navy-700: #123A7A;
  --accent: #FCB514; --accent-ink: #07173A; --accent-deep: #4A3608; --accent-soft: #FCE3A0;
  --stripe1: #FCB514; --stripe2: #FFFFFF; --stripe3: #0B3C8C;
}

#app {
  height: 100%; display: flex; flex-direction: column; gap: 12px;
  padding-block: calc(var(--safe-t) + 16px) calc(var(--safe-b) + 16px);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}

/* Header */
.top { display: flex; align-items: center; gap: 16px; min-height: 60px; flex: none; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.brand img { width: 56px; height: 56px; display: block; }
.brand-text { display: flex; flex-direction: column; gap: 4px; line-height: 1; }
.eyebrow { font-size: 12px; letter-spacing: 0.22em; color: var(--muted); font-weight: 600; }
.title { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: 0.02em; white-space: nowrap; }
.tabrow { display: flex; align-items: center; gap: 12px; flex: none; min-height: 48px; }
.tabrow .tabs { flex: 1; min-width: 0; }
.pill {
  flex: none; max-width: 44%; height: 46px; border-radius: 23px; background: var(--navy-800);
  display: flex; align-items: center; gap: 12px; padding: 0 20px; overflow: hidden; font-weight: 600; font-size: 16px;
}
.pill #nowText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.eq { display: flex; align-items: flex-end; gap: 3px; height: 18px; flex: none; }
.eq i { width: 4px; height: 18px; border-radius: 2px; background: var(--accent); transform-origin: bottom; animation: eq 0.6s ease-in-out infinite alternate; }
.eq i:nth-child(2) { background: #fff; animation-duration: 0.8s; }
.eq i:nth-child(3) { animation-duration: 0.5s; }
@keyframes eq { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
.btn {
  flex: none; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 10px; white-space: nowrap;
}
.btn-edit { padding: 0 20px; border: 2px solid rgba(255, 255, 255, 0.35); background: transparent; font-size: 17px; font-weight: 600; }
.btn-edit[aria-pressed=true] { background: #fff; color: var(--navy-900); }
.btn-stop {
  width: 176px; border: 0; background: var(--accent-deep); color: var(--accent-soft);
  font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: 0.04em;
}
.btn-stop.live { background: var(--accent); color: var(--accent-ink); }

/* Team toggle */
.top .team { flex: none; width: 230px; height: 48px; }
.team button { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: 0.08em; }
.team button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }

/* Tabs */
.tabs { display: flex; gap: 10px; flex: none; overflow-x: auto; scrollbar-width: none; align-items: center; min-height: 48px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; height: 46px; padding: 0 20px; border-radius: 23px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.08); color: #fff; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 9px;
}
.tab[aria-pressed=true] { background: #fff; color: var(--navy-900); }
.tab .dot { width: 10px; height: 10px; border-radius: 5px; }
.tab .n { opacity: 0.6; font-weight: 500; }
.tabs .count { margin-left: auto; padding-left: 12px; flex: none; font-size: 14px; color: var(--muted); white-space: nowrap; }

/* Grid and tiles */
.grid { flex: 1; min-height: 0; display: grid; gap: 10px; }
.tile {
  position: relative; overflow: hidden; min-width: 0; min-height: 0; border: 0; border-radius: 18px;
  background: var(--bg); color: var(--fg); padding: 16px 18px; text-align: left;
  display: flex; flex-direction: column; justify-content: space-between; gap: 6px; container-type: size;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), 0 3px 0 rgba(0, 0, 0, 0.4);
  transition: transform 0.06s;
}
.tile:active { transform: scale(0.97); }
.tile .chip { align-self: flex-start; padding: 3px 10px; border-radius: 10px; background: var(--chip); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .name {
  font-family: var(--display); font-weight: 800; font-size: clamp(15px, min(10.5cqi, 19cqh), 40px); line-height: 1;
  letter-spacing: 0.02em; text-transform: uppercase; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
}
.tile .status { display: flex; align-items: center; font-size: 14px; font-weight: 600; opacity: 0.85; }
.tile .status > span { display: flex; align-items: center; gap: 7px; }
.tile .st-play { display: none !important; }
.tile.playing .st-play { display: flex !important; }
.tile.playing .st-idle { display: none !important; }
.tile.playing { box-shadow: 0 0 0 4px #fff, 0 0 40px 6px rgba(255, 255, 255, 0.35); }
.tile .bar { position: absolute; left: 0; bottom: 0; height: 7px; width: 0; background: var(--fg); opacity: 0.9; display: none; }
.tile.playing .bar { display: block; animation: fill var(--dur) linear forwards; }
.tile.playing.looping .bar { animation-iteration-count: infinite; }
@keyframes fill { from { width: 0; } to { width: 100%; } }
.tile.sel { outline: 3px dashed #fff; outline-offset: 3px; }
.compact .tile { padding: 10px 14px; }
.compact .tile .chip { display: none; }
.compact .tile .name { font-size: clamp(14px, min(9cqi, 24cqh), 24px); }
@container (max-height: 150px) { .tile .chip { display: none; } }
.compact .tile .status { font-size: 13px; }
.glabel { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-right: 8px; }
.glabel .gn { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase; }
.glabel .gn i { width: 10px; height: 10px; border-radius: 5px; flex: none; }
.glabel .gc { font-size: 13px; color: var(--muted); }
.gap { border-radius: 18px; border: 1px dashed rgba(255, 255, 255, 0.12); }
.empty {
  grid-column: 1 / -1; grid-row: 1 / -1; border: 2px dashed rgba(255, 255, 255, 0.25); border-radius: 24px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
}
.empty h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 40px; text-transform: uppercase; letter-spacing: 0.02em; }
.empty p { margin: 0; color: var(--muted); font-size: 17px; max-width: 46ch; }
.empty .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.big { height: 54px; padding: 0 26px; border-radius: 27px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 18px; font-weight: 600; }
.big.ghost { background: transparent; border: 2px solid rgba(255, 255, 255, 0.4); }

/* Edit drawer */
.panel { flex: none; height: 184px; border-radius: 20px; background: var(--navy-800); padding: 14px; display: flex; gap: 14px; }
.p-col { min-width: 0; display: flex; flex-direction: column; }
.p-up { flex: none; width: 250px; gap: 8px; }
.p-lay { flex: none; width: 330px; gap: 4px; justify-content: center; }
.p-insp { flex: 1; gap: 6px; justify-content: center; }
.drop {
  flex: 1; min-height: 0; border-radius: 14px; border: 2px dashed rgba(255, 255, 255, 0.4); background: transparent; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px; text-align: center;
}
.drop-t { font-size: 17px; font-weight: 600; }
.drop-s { font-size: 12px; color: var(--muted); }
.mini-row { display: flex; gap: 6px; flex: none; }
.mini {
  flex: 1; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.08);
  font-size: 15px; font-weight: 600; padding: 0 10px; white-space: nowrap;
}
.mini-w { flex: none; padding: 0 18px; }
.mini-red { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.mini-danger { color: #FFB3C0; }
.mini-danger.armed { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.cols-row, .i-vol { display: flex; align-items: center; gap: 12px; height: 44px; }
.lbl { width: 66px; flex: none; font-size: 15px; color: rgba(255, 255, 255, 0.7); }
.seg { display: flex; flex: 1; height: 44px; border-radius: 22px; background: rgba(255, 255, 255, 0.08); padding: 3px; min-width: 0; }
.seg button { flex: 1; min-width: 0; border: 0; border-radius: 19px; background: transparent; font-size: 15px; font-weight: 600; padding: 0 4px; white-space: nowrap; }
.seg button[aria-pressed=true] { background: #fff; color: var(--navy-900); }
.sw { height: 44px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0; text-align: left; font-size: 15px; }
.sw i { flex: none; width: 52px; height: 30px; border-radius: 15px; background: rgba(255, 255, 255, 0.25); padding: 3px; display: flex; }
.sw i b { width: 24px; height: 24px; border-radius: 12px; background: #fff; }
.sw[aria-pressed=true] i { background: var(--accent); justify-content: flex-end; }
.sw[aria-pressed=true] i b { background: var(--accent-ink); }
.i-head { display: flex; align-items: center; gap: 10px; height: 44px; min-width: 0; }
.chip-s { flex: none; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.chip-s:empty { display: none; }
.i-name { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.i-norm { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
#volOut { width: 34px; text-align: right; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 44px; margin: 0; background: transparent; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.28); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -12px; border-radius: 15px; background: #fff; border: 0; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.28); }
input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 15px; background: #fff; border: 0; }

/* Clip editor */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(3, 10, 28, 0.78); display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet { width: min(1000px, 100%); max-height: 100%; overflow: auto; background: var(--navy-800); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.ed-top { display: flex; align-items: center; gap: 10px; }
.ed-top h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; text-transform: uppercase; letter-spacing: 0.02em; }
.ed-spacer { flex: 1; }
.ed-fields { display: flex; gap: 14px; flex-wrap: wrap; }
.field { flex: 1 1 280px; display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.field input { height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--navy-900); color: #fff; font: inherit; font-size: 18px; padding: 0 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips:empty { display: none; }
.chips button { height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.08); font-size: 15px; font-weight: 600; }
.chips button[aria-pressed=true] { background: #fff; color: var(--navy-900); }
.sheet > * { flex: none; }
.wave-wrap { border-radius: 14px; background: var(--navy-900); overflow: hidden; }
#wave { display: block; width: 100%; height: 180px; }
.times { display: flex; gap: 22px; flex-wrap: wrap; font-size: 15px; color: rgba(255, 255, 255, 0.8); font-variant-numeric: tabular-nums; }
.hint { margin: 0; font-size: 14px; color: var(--muted); }
.nudge { display: flex; gap: 18px; flex-wrap: wrap; }
.ng { display: flex; align-items: center; gap: 8px; }
.ng span { width: 46px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ng .mini-w { width: 56px; padding: 0; font-size: 22px; }
.times b { color: #fff; font-weight: 600; }
.ed-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Start screen and toast */
.start { position: fixed; inset: 0; z-index: 50; background: var(--navy-900); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.start img { width: min(200px, 30vh); height: auto; }
.start p { margin: 0; color: var(--muted); font-size: 17px; }
.start-btn { height: 72px; padding: 0 48px; border-radius: 36px; border: 0; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: 0.06em; }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--safe-b) + 28px); transform: translateX(-50%); z-index: 60;
  max-width: min(90vw, 560px); padding: 14px 22px; border-radius: 26px; background: #fff; color: var(--navy-900); font-size: 16px; font-weight: 600; text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

@media (max-width: 900px) {
  .brand-text { display: none; }
  .title { font-size: 22px; }
  .panel { height: auto; max-height: 46vh; overflow: auto; flex-wrap: wrap; }
  .p-up, .p-lay { width: 100%; }
  .p-up { flex-direction: row; }
  .drop { min-height: 70px; }
  .p-insp { flex: 1 1 100%; }
  .btn-stop { width: 150px; }
  .top .team { width: 190px; }
}

/* Phones: portrait (narrow) */
@media (max-width: 700px) {
  .panel { padding: 10px; gap: 8px; }
  .p-up .drop-s { display: none; }
  #app { gap: 8px; padding-block: calc(var(--safe-t) + 10px) calc(var(--safe-b) + 10px); padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
  .top { gap: 6px; min-height: 40px; }
  .brand { flex: none; }
  .brand img { width: 34px; height: 34px; }
  .top .team { flex: 1; width: auto; min-width: 120px; height: 40px; }
  .team button { font-size: 16px; letter-spacing: 0.03em; padding: 0 2px; }
  .btn { height: 40px; border-radius: 20px; }
  .btn-edit { width: 40px; padding: 0; }
  #btnEditLabel { display: none; }
  .btn-stop { width: auto; padding: 0 10px; font-size: 16px; gap: 5px; }
  .btn-stop svg { width: 16px; height: 16px; }
  .tabrow { min-height: 40px; }
  .tabs { min-height: 40px; gap: 8px; }
  .tabs .count { display: none; }
  .tab { height: 38px; padding: 0 14px; font-size: 15px; }
  .pill { font-size: 13px; padding: 0 12px; max-width: 45%; }
  .grid { gap: 6px; }
  .tile { padding: 8px 10px; border-radius: 12px; }
  .tile .chip { display: none; }
  .tile .status { font-size: 12px; }
  .tile .name { font-size: clamp(12px, min(9.5cqi, 24cqh), 26px); }
  .empty h2 { font-size: 30px; }
  .empty p { font-size: 15px; }
  .big { height: 48px; font-size: 16px; padding: 0 20px; }
  .start-btn { height: 60px; padding: 0 36px; font-size: 28px; }
  .start img { width: 140px; height: 140px; }
  .modal { padding: 0; align-items: stretch; }
  .sheet { border-radius: 0; max-height: none; height: 100%; padding: calc(var(--safe-t) + 12px) 14px calc(var(--safe-b) + 14px); gap: 10px; }
  .ed-top { order: -3; position: sticky; top: 0; z-index: 2; background: var(--navy-800); } .hint { order: -2; } .wave-wrap { order: -1; }
  #wave { height: 170px; }
  .ed-top h2 { font-size: 24px; }
  .times { gap: 4px 14px; font-size: 14px; }
  .ed-row { flex-wrap: wrap; }
  .glabel .gn { font-size: 16px; }
  .toast { font-size: 14px; }
}
/* Phones: landscape (short) */
@media (max-height: 500px) {
  #app { gap: 6px; padding-block: calc(var(--safe-t) + 6px) calc(var(--safe-b) + 6px); }
  .top { min-height: 40px; gap: 10px; }
  .brand img { width: 36px; height: 36px; }
  .brand-text { display: none; }
  .btn { height: 38px; border-radius: 19px; }
  .btn-stop { width: 140px; font-size: 21px; }
  .btn-edit { padding: 0 14px; font-size: 15px; }
  .top .team { height: 38px; width: 200px; }
  .team button { font-size: 17px; }
  .tabrow { min-height: 34px; }
  .tabs { min-height: 34px; }
  .tab { height: 32px; padding: 0 14px; font-size: 14px; }
  .tabs .count { display: none; }
  .grid { gap: 6px; }
  .tile { padding: 6px 10px; border-radius: 12px; }
  .tile .chip { display: none; }
  .tile .status { font-size: 11px; }
  .panel { max-height: 60vh; }
  .modal { padding: 0; align-items: stretch; }
  .sheet { border-radius: 0; max-height: none; height: 100%; padding: 8px 16px 10px; gap: 8px; }
  .ed-top { order: -3; position: sticky; top: 0; z-index: 2; background: var(--navy-800); padding-bottom: 2px; }
  .ed-top h2 { font-size: 22px; }
  .hint { order: -2; font-size: 12px; }
  .wave-wrap { order: -1; }
  #wave { height: 120px; }
  .field { flex-basis: 220px; }
  .field input { height: 40px; font-size: 16px; }
  .field label { font-size: 11px; }
  .chips button { height: 34px; }
  .times { font-size: 13px; }
  .ng .mini-w { height: 38px; }
}
@container (max-height: 80px) { .tile .status { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .eq i { animation: none; }
  .tile { transition: none; }
}

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <img id="logo" src="logo.png" data-bills="logo.png" data-sabres="logo-gold.png" alt="Fulton Ale House logo" width="56" height="56">
      <div class="brand-text">
        <span class="eyebrow">FULTON ALE HOUSE</span>
        <span class="title">

    var c = ED.c;
    if (!$('#edDelete').classList.contains('armed')) {
      $('#edDelete').classList.add('armed'); $('#edDelete').textContent = 'Tap again to delete';
      clearTimeout(delT); delT = setTimeout(function () { if (ED) { $('#edDelete').classList.remove('armed'); $('#edDelete').textContent = 'Delete clip'; } }, 3000);
      return;
    }
    closeEditor(); stopVoice(c.id);
    S.clips = S.clips.filter(function (x) { return x.id !== c.id; });
    if (S.persist) { DB.del('clips', c.id).catch(fail); DB.del('audio', c.id).catch(fail); }
    var l = visible(); S.selected = l.length ? l[0].id : null;
    fixTags(); saveSettings(); renderAll(); toast('Clip deleted.');
  }
  function moveClip(id, dir) {
    var list = visible(), i = list.findIndex(function (c) { return c.id === id; }), j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    var a = list[i], b = list[j], t = a.order; a.order = b.order; b.order = t;
    saveClip(a); saveClip(b); renderGrid();
  }

  /* ---------- events ---------- */
  var grid = $('#grid');
  grid.addEventListener('pointerdown', function (e) {
    var t = e.target.closest('.tile');
    if (!t || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault(); press(t.dataset.id);
  });
  grid.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]');
    if (a) { if (a.dataset.act === 'add') $('#fileIn').click(); else if (typeof Demo !== 'undefined') loadDemo(); return; }
    var t = e.target.closest('.tile');
    if (t && e.detail === 0) press(t.dataset.id);
  });
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (!b) return;
    S.tag = b.dataset.tag;
    if (S.edit) { var l = visible(); if (!l.some(function (c) { return c.id === S.selected; })) S.selected = l.length ? l[0].id : null; }
    renderTabs(); renderPanel(); renderGrid();
  });
  $('#btnStop').addEventListener('pointerdown', function (e) { e.preventDefault(); stopAll(); });
  $('#btnStop').addEventListener('click', function (e) { if (e.detail === 0) stopAll(); });
  $('#btnEdit').addEventListener('click', function () { setEdit(!S.edit); });
  $('#segTeam').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setTeam(b.dataset.team); });
  $('#btnAdd').addEventListener('click', function () { $('#fileIn').click(); });
  $('#fileIn').addEventListener('change', function (e) { var f = Array.from(e.target.files || []); e.target.value = ''; if (f.length) handleFiles(f); });
  $('#btnBackup').addEventListener('click', exportBackup);
  $('#btnRestore').addEventListener('click', function () { $('#restoreIn').click(); });
  $('#restoreIn').addEventListener('change', function (e) { var f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
  $('#btnClear').addEventListener('click', function () {
    var b = $('#btnClear');
    if (!teamClips().length) { toast('There are no ' + TEAMS[S.team] + ' clips to clear.'); return; }
    if (!clearArmed) {
      clearArmed = true; b.textContent = 'Sure?'; b.classList.add('mini-red');
      clearT = setTimeout(function () { clearArmed = false; b.textContent = 'Clear'; b.classList.remove('mini-red'); }, 3000);
      return;
    }
    clearTimeout(clearT); clearArmed = false; b.textContent = 'Clear'; b.classList.remove('mini-red'); clearAll();
  });
  $('#segCols').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.cols = b.dataset.v === 'auto' ? 'auto' : Number(b.dataset.v);
    saveSettings(); renderPanel(); renderGrid();
  });
  $('#swGroup').addEventListener('click', function () { S.grouped = !S.grouped; saveSettings(); renderPanel(); renderGrid(); });
  $('#swCut').addEventListener('click', function () { S.cutoff = !S.cutoff; saveSettings(); renderPanel(); });
  $('#segMode').addEventListener('click', function (e) {
    var b = e.target.closest('button'), c = byId(S.selected); if (!b || !c) return;
    c.mode = b.dataset.v; saveClip(c); renderInspector(); renderGrid();
  });
  $('#vol').addEventListener('input', function (e) {
    var c = byId(S.selected); if (!c) return;
    c.vol = Number(e.target.value); $('#volOut').textContent = c.vol; saveClipSoon(c);
    var v = voices.get(c.id);
    if (v) { var t = ctx.currentTime; v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(E.dbToLin(c.gainDb + E.volDb(c.vol)), t); }
  });
  $('#vol').addEventListener('change', function () {
    var c = byId(S.selected); if (!c || !c.buf) return;
    resumeCtx(); stopAll(); startVoice(c, { mode: 'full' });
  });
  $('#btnEditClip').addEventListener('click', function () { if (S.selected) openEditor(S.selected); });

  var cv = $('#wave');
  cv.addEventListener('pointerdown', function (e) {
    if (!ED) return;
    var r = cv.getBoundingClientRect(), x = e.clientX - r.left, dur = ED.c.buf.duration;
    var sx = ED.start / dur * r.width, ex = ED.end / dur * r.width;
    ED.drag = Math.abs(x - sx) <= Math.abs(x - ex) ? 'start' : 'end';
    cv.setPointerCapture(e.pointerId); moveHandle(e);
  });
  cv.addEventListener('pointermove', function (e) { if (ED && ED.drag) moveHandle(e); });
  ['pointerup', 'pointercancel'].forEach(function (n) { cv.addEventListener(n, function () { if (ED) ED.drag = null; }); });
  $('#editor').addEventListener('click', function (e) {
    var b = e.target.closest('[data-nudge]'); if (!b || !ED) return;
    var d = Number(b.dataset.d), dur = ED.c.buf.duration;
    if (b.dataset.nudge === 'start') ED.start = Math.max(0, Math.min(ED.start + d, ED.end - 0.05));
    else ED.end = Math.min(dur, Math.max(ED.end + d, ED.start + 0.05));
    drawWave(); updateTimes();
  });
  $('#edTag').addEventListener('input', refreshChips);
  $('#edChips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $('#edTag').value = b.dataset.tag; refreshChips();
  });
  $('#edPrev').addEventListener('click', function () { if (ED) previewEditor(); });
  $('#edAuto').addEventListener('click', function () {
    if (!ED) return;
    var a = E.findActive(chans(ED.c.buf), ED.c.buf.sampleRate); ED.start = a.start; ED.end = a.end; drawWave(); updateTimes();
  });
  $('#edReset').addEventListener('click', function () { if (!ED) return; ED.start = 0; ED.end = ED.c.buf.duration; drawWave(); updateTimes(); });
  $('#edEarlier').addEventListener('click', function () { if (ED) moveClip(ED.c.id, -1); });
  $('#edLater').addEventListener('click', function () { if (ED) moveClip(ED.c.id, 1); });
  $('#edDelete').addEventListener('click', function () { if (ED) deleteClip(); });
  $('#edSave').addEventListener('click', function () { if (ED) saveEditor(); });
  $('#edCancel').addEventListener('click', closeEditor);
  window.addEventListener('resize', function () { if (ED) drawWave(); });

  var rt;
  if (window.ResizeObserver) new ResizeObserver(function () { clearTimeout(rt); rt = setTimeout(renderGrid, 80); }).observe(grid);
  document.addEventListener('contextmenu', function (e) { if (e.target.tagName !== 'INPUT') e.preventDefault(); });
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = Array.from((e.dataTransfer && e.dataTransfer.files) || []).filter(function (x) { return /^audio\//.test(x.type) || /\.(mp3|wav|m4a|aac|ogg)$/i.test(x.name); });
    if (f.length) handleFiles(f);
  });

  /* ---------- start up ---------- */
  var wake = null;
  function keepAwake() {
    try {
      if (navigator.wakeLock && document.visibilityState === 'visible') {
        navigator.wakeLock.request('screen').then(function (l) { wake = l; l.addEventListener('release', function () { wake = null; }); }).catch(function () {});
      }
    } catch (e) { /* optional */ }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.started) { keepAwake(); resumeCtx(); }
  });
  $('#btnStart').addEventListener('click', function () {
    initAudio(); unlock();
    S.started = true; $('#start').hidden = true; keepAwake();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) { /* optional */ }
  });

  async function boot() {
    initAudio();
    try { await DB.open(); } catch (e) { S.persist = false; }
    if (S.persist) {
      try {
        var st = await DB.get('meta', 'settings');
        if (st) {
          S.cols = st.cols === undefined ? 'auto' : st.cols; S.grouped = !!st.grouped; S.cutoff = st.cutoff !== false;
          S.team = st.team === 'sabres' ? 'sabres' : 'bills';
          S.tagOrders = st.tagOrders || { bills: st.tagOrder || [], sabres: [] };
          if (!S.tagOrders.bills) S.tagOrders.bills = []; if (!S.tagOrders.sabres) S.tagOrders.sabres = [];
          S.tagOrder = S.tagOrders[S.team];
        }
        var metas = await DB.all('clips');
        for (var i = 0; i < metas.length; i++) {
          var m = metas[i], ab = await DB.get('audio', m.id);
          if (!ab) continue;
          try { m.buf = await decode(ab.slice(0)); m.team = m.team || 'bills'; S.clips.push(m); } catch (e) { /* skip unreadable clip */ }
        }
      } catch (e) { fail(); }
    } else toast("This browser can't keep clips between sessions. Use Back up before closing.", 6000);
    fixTags(); renderAll();
    var l = visible(); S.selected = l.length ? l[0].id : null;
  }
  window.__sb = { S: S, voices: voices, E: E, press: press };
  boot();
  try {
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      var hadCtl = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadCtl && !voices.size && !sessionStorage.getItem('sbReloaded')) { try { sessionStorage.setItem('sbReloaded', '1'); } catch (e) {} location.reload(); } });
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  } catch (e) { /* optional */ }
})();

</script>
</body>
</html>
